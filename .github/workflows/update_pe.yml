name: Update Sector P/E Daily

on:
  schedule:
    # Runs at 11:30 AM UTC (5:00 PM IST) every Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows you to click a button to run it manually

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        run: python fetch_sector_pe.py

      - name: Commit and Push JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add sector_pe.json
          # Only commit if the file has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Sector PE data" && git push)
